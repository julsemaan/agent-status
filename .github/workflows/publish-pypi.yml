name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match vMAJOR.MINOR.PATCH: $TAG"
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error::Release tag must be annotated: $TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit must belong to main: $GITHUB_SHA"
            exit 1
          fi

      - name: Validate manifest versions
        env:
          TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import json
          import os
          import sys
          import tomllib

          expected = os.environ["TAG"].removeprefix("v")
          with open("pyproject.toml", "rb") as file:
              pyproject = tomllib.load(file)["project"]["version"]
          with open("package.json") as file:
              package = json.load(file)
          with open("package-lock.json") as file:
              package_lock = json.load(file)
          with open(".codex-plugin/plugin.json") as file:
              plugin = json.load(file)

          versions = {
              "tag": expected,
              "pyproject.toml": pyproject,
              "package.json": package["version"],
              "package-lock.json": package_lock["version"],
              "package-lock.json root package": package_lock["packages"][""]["version"],
              ".codex-plugin/plugin.json": plugin["version"],
          }
          mismatches = {name: version for name, version in versions.items() if version != expected}
          if mismatches:
              print(f"::error::Release version mismatch: {versions}")
              sys.exit(1)
          print(f"Release versions match: {expected}")

      - name: Run Python tests
        run: python3 -m unittest

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Build and check package
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-status
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0

  publish-github:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
