name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Assert versions match
        shell: python
        run: |
          import json
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as file:
              expected = tomllib.load(file)["project"]["version"]

          with open("package.json") as file:
              package = json.load(file)
          with open("package-lock.json") as file:
              package_lock = json.load(file)
          with open(".codex-plugin/plugin.json") as file:
              plugin = json.load(file)

          versions = {
              "pyproject.toml": expected,
              "package.json": package["version"],
              "package-lock.json": package_lock["version"],
              "package-lock.json root package": package_lock["packages"][""]["version"],
              ".codex-plugin/plugin.json": plugin["version"],
          }
          drift = {name: version for name, version in versions.items() if version != expected}
          if drift:
              print(f"::error::Version drift: {versions}")
              sys.exit(1)
          print(f"Versions match: {expected}")

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Run Python tests
        run: python3 -m unittest

      - name: Build package
        run: |
          python -m pip install build twine
          python -m build

      - name: Check package
        run: twine check dist/*
